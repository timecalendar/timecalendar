kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ include "timecalendar.fullname" . }}-configmap
data:
  # Node
  NODE_ENV: "production"
  APP_STAGE: {{ .Values.environment }}

  # HTTP
  PORT: "80"

  # URLs
  CLIENT_URL: "https://{{ .Values.clientUrl }}"

  # Redis
  REDIS_QUEUE: timecalendar
  # BullMQ worker concurrency for the default queue. The default here MUST stay 100 and
  # MUST NOT be "": server/src/config/constants.ts reads
  # `+(env.QUEUE_CONCURRENCY ?? 100)`, and `+("")` is 0, not 100 -- an empty string here
  # would set concurrency to 0 and stall the queue silently. `??` only catches null and
  # undefined, and an empty ConfigMap value arrives as "".
  QUEUE_CONCURRENCY: {{ .Values.timecalendar.queueConcurrency | default 100 | quote }}
  # NOTE: REDIS_KEY_PREFIX is retired as of the nest-shared migration (TIM-143).
  # nest-shared's SharedRedisModule/SharedBullModule connect by REDIS_URL only
  # and do not apply a per-environment Bull key prefix. Isolation is owned by the
  # logical DB index (or separate instance) in the sealed REDIS_URL, NOT by this
  # prefix: production uses DB 0 and preproduction uses DB 1 (TIM-294). Sources:
  # lyrolab/platform/kubernetes/clusters/do-fra1-cluster01/20-apps/
  # timecalendar-production/env-sealed-secret.yaml and the corresponding
  # timecalendar-preprod path. Before deploying a new environment, give it a
  # distinct DB index or instance, then verify the effective value inside the pod
  # with `printenv REDIS_URL` rather than inferring it from the encrypted manifest.

  # Postgres
  # DATABASE_URL (full connection string, incl. the password) is provided by the
  # timecalendar-env-secret, assembled from the existing secret parts — it must be
  # added to that sealed secret atomically with the PR1 server image that reads it
  # (the split DATABASE_HOST/PORT/USERNAME/MAIN_NAME vars are no longer read).
  PGSSLMODE: no-verify

  RUN_MIGRATIONS: "true"

  # SMTP
  SMTP_FROM: {{ .Values.timecalendar.smtpFrom }}

  API_USERNAME: {{ .Values.timecalendar.apiUsername }}

  S3_PUBLIC_BUCKET_CLIENT_URL: {{ .Values.timecalendar.s3PublicBucketClientUrl }}

  CRISP_IDENTIFIER: {{ .Values.timecalendar.crisp.identifier }}
  CRISP_WEBSITE_ID: {{ .Values.timecalendar.crisp.websiteId }}

  # Background calendar sync fan-out. Empty = no background sync at all
  # (on-access sync is unaffected). Production stays empty until mid-September
  # 2026: rentree timetables still churn, so re-syncs are noise for students.
  # Flipping this is a values change — no image rebuild — and the server tears
  # down the live BullMQ scheduler when it is emptied.
  SYNC_CALENDARS_CRON: {{ .Values.timecalendar.syncCalendarsCron | quote }}

  # OTEL
  OTEL_ENABLED: {{ .Values.timecalendar.otel.enabled | quote }}
  OTEL_EXPORTER_URL: {{ .Values.timecalendar.otel.exporterUrl }}
