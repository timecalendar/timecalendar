# Default values for timecalendar.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

environment: ""

server:
  replicaCount: 1
  tag: ""
web:
  replicaCount: 1
  tag: ""

nameOverride: ""
fullnameOverride: ""

# TimeCalendar custom values
apiUrl: ""
clientUrl: ""
webUrl: ""

timecalendar:
  # DATABASE_URL / REDIS_URL are supplied via the timecalendar-env-secret, not
  # here — the split database.{host,port,username,database} values are gone.
  apiUsername: ""
  # BullMQ worker concurrency for the default queue. MUST default to 100 to match
  # server/src/config/constants.ts -- see the note in server-configmap.yaml.
  queueConcurrency: 100
  # Cron for the background calendar-sync fan-out; "" disables it. Opt-in by
  # design — the fan-out hits third-party university servers.
  syncCalendarsCron: ""
  smtpFrom: ""
  s3PublicBucketClientUrl: ""
  crisp:
    identifier: ""
    websiteId: ""
  otel:
    enabled: ""
    exporterUrl: ""
