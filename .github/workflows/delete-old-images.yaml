name: Delete old container images

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      cut-off:
        description: The timezone-aware datetime you want to delete container versions that are older than.
        required: false
        type: string

jobs:
  clean-ghcr:
    name: Delete old unused container images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Retain server images
        uses: snok/container-retention-policy@v2
        with:
          image-names: timecalendar
          cut-off: ${{ inputs.cut-off || '1 week ago UTC' }}
          account-type: org
          org-name: timecalendar
          keep-at-least: 5
          skip-tags: latest, production
          token: ${{ github.token }}
          token-type: github-token
          dry-run: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Retain web images
        uses: snok/container-retention-policy@v2
        with:
          image-names: timecalendar-web
          cut-off: ${{ inputs.cut-off || '1 week ago UTC' }}
          account-type: org
          org-name: timecalendar
          keep-at-least: 5
          skip-tags: latest, production
          token: ${{ github.token }}
          token-type: github-token
          dry-run: ${{ github.event_name == 'workflow_dispatch' }}
