name: CI mobile E2E

# Native mobile end-to-end (Maestro on a real emulator/simulator). This is a
# daily/manual health signal, not a pull-request gate. The preparation job
# avoids native allocation when no relevant change landed since the preceding
# scheduled attempt and resolves one immutable commit before platform fan-out.
#
# This workflow is self-contained: it builds its own server image (cache-from
# type=gha — a fast cache hit when ci-build-deploy already built it for this
# SHA) rather than sharing an artifact across workflow runs.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or commit SHA to test
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-mobile-e2e
  cancel-in-progress: false

jobs:
  prepare:
    name: Select native E2E target
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.select.outputs.should_run }}
      target_sha: ${{ steps.select.outputs.target_sha }}
      comparison_base: ${{ steps.select.outputs.comparison_base }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - name: Checkout selected target
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'main' }}
          fetch-depth: 0

      - name: Find preceding scheduled attempt
        id: previous
        if: github.event_name == 'schedule'
        uses: actions/github-script@v9
        env:
          CURRENT_RUN_NUMBER: ${{ github.run_number }}
          WORKFLOW_FILE: ci-mobile-e2e.yml
        with:
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: process.env.WORKFLOW_FILE,
                event: 'schedule',
                branch: 'main',
                per_page: 100,
              },
            );
            const currentRunNumber = Number(process.env.CURRENT_RUN_NUMBER);
            const previous = runs
              .filter((run) => run.run_number < currentRunNumber)
              .sort((left, right) => right.run_number - left.run_number)[0];
            core.setOutput('head_sha', previous?.head_sha ?? '');
            core.setOutput('run_number', previous?.run_number ?? '');

      - name: Select execution decision
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_REF: ${{ inputs.ref }}
          PREVIOUS_SHA: ${{ steps.previous.outputs.head_sha }}
          PREVIOUS_RUN_NUMBER: ${{ steps.previous.outputs.run_number }}
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD^{commit})"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved native E2E target: $target_sha"

          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            [ -n "$MANUAL_REF" ] || {
              echo 'Manual dispatch requires a non-empty ref input' >&2
              exit 1
            }
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
            echo 'comparison_base=' >> "$GITHUB_OUTPUT"
            echo 'reason=manual dispatch always runs both platforms' >> "$GITHUB_OUTPUT"
            echo "Manual ref resolved to $target_sha; both platforms selected"
            exit 0
          fi

          if [ -z "$PREVIOUS_SHA" ]; then
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
            echo 'comparison_base=' >> "$GITHUB_OUTPUT"
            echo 'reason=no preceding scheduled attempt; initializing health signal' >> "$GITHUB_OUTPUT"
            echo 'No preceding scheduled attempt; both platforms selected'
            exit 0
          fi

          git cat-file -e "$PREVIOUS_SHA^{commit}" || {
            echo "Preceding scheduled target is unavailable: $PREVIOUS_SHA" >&2
            exit 1
          }
          echo "comparison_base=$PREVIOUS_SHA" >> "$GITHUB_OUTPUT"
          changed_paths="$(git diff --name-only "$PREVIOUS_SHA" "$target_sha")"
          printf 'Comparing scheduled run %s (%s) to %s\n' \
            "$PREVIOUS_RUN_NUMBER" "$PREVIOUS_SHA" "$target_sha"
          printf '%s\n' "$changed_paths"

          relevant=false
          while IFS= read -r path; do
            case "$path" in
              mobile/*|openapi/*|server/*|ci/e2e-server.sh|ci/generate-dummy-firebase-key.sh|.nvmrc|.github/workflows/ci-mobile-e2e.yml)
                relevant=true
                break
                ;;
            esac
          done <<< "$changed_paths"

          if [ "$relevant" = true ]; then
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
            echo 'reason=relevant changes since preceding scheduled attempt' >> "$GITHUB_OUTPUT"
            echo 'Relevant changes found; both platforms selected'
          else
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
            echo 'reason=no relevant changes since preceding scheduled attempt' >> "$GITHUB_OUTPUT"
            echo 'No relevant changes; native allocation skipped'
          fi

  build-server:
    name: Build server image
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected target
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          tags: ghcr.io/timecalendar/timecalendar:${{ needs.prepare.outputs.target_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Save server image to tarball
        run: docker save ghcr.io/timecalendar/timecalendar:${{ needs.prepare.outputs.target_sha }} -o /tmp/server-image.tar

      - name: Upload server image artifact
        uses: actions/upload-artifact@v7
        with:
          name: server-image
          path: /tmp/server-image.tar
          retention-days: 1

  e2e-mobile-android:
    name: Run mobile E2E (Android)
    needs: [prepare, build-server]
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # Emulator cold boot + a release Gradle build are both slow; KVM keeps the
    # emulator usable but the whole job is the long pole alongside the iOS one.
    timeout-minutes: 60
    env:
      # Reuse the build-server artifact image — the shared lifecycle skips its
      # own build when E2E_SERVER_IMAGE is set (ci/e2e-server.sh).
      E2E_SERVER_IMAGE: ghcr.io/timecalendar/timecalendar:${{ needs.prepare.outputs.target_sha }}
    steps:
      - name: Checkout selected target
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}

      - name: Download server image artifact
        uses: actions/download-artifact@v8
        with:
          name: server-image
          path: /tmp

      - name: Load server image
        run: docker load -i /tmp/server-image.tar

      # JDK 17 for both the Gradle build and Maestro (Maestro is JVM-based).
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Generate native android/ for the dev variant (.dev id, timecalendar-dev
      # scheme, cleartext exception). CNG: ios/android are never committed.
      - name: Prebuild Android (dev variant)
        working-directory: ./mobile
        env:
          APP_VARIANT: development
          BACKEND_ENVIRONMENT_CAPABILITY: development
          EXPO_PUBLIC_API_URL: http://10.0.2.2:3005
        run: npx expo prebuild --platform android --clean

      # Release config embeds the JS bundle (no Metro). EXPO_PUBLIC_API_URL is
      # baked here, at bundle time: 10.0.2.2 is the host loopback from the emulator.
      - name: Build release APK
        working-directory: ./mobile/android
        env:
          APP_VARIANT: development
          BACKEND_ENVIRONMENT_CAPABILITY: development
          EXPO_PUBLIC_API_URL: http://10.0.2.2:3005
        run: |
          echo 'Gradle bounds: heap=3072 MiB, Metaspace=1024 MiB, max-workers=2, daemon=off'
          ./gradlew \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1024m" \
            :app:assembleRelease

      - name: Install Maestro
        run: |
          export MAESTRO_VERSION=2.8.0
          curl -fsSL https://get.maestro.mobile.dev | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          maestro --version

      - name: Test mobile E2E harness
        run: |
          ./mobile/e2e/test_run_e2e.sh
          ./mobile/e2e/test_ci_mobile_e2e.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator exists only inside this action's `script`, so the APK install
      # and the e2e run both live here. run_e2e.sh boots the server stack (compose,
      # reusing E2E_SERVER_IMAGE), runs the Maestro flows, and tears down.
      - name: Run mobile E2E flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r mobile/android/app/build/outputs/apk/release/app-release.apk
            ./mobile/e2e/run_e2e.sh

      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-debug-android
          path: ~/.maestro/tests
          retention-days: 7

      - name: Upload server logs
        if: failure()
        run: ./ci/e2e-server.sh logs > /tmp/e2e-server-android.log 2>&1 || true

      - name: Upload server logs artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-server-logs-android
          path: /tmp/e2e-server-android.log
          retention-days: 7

  e2e-mobile-ios:
    name: Run mobile E2E (iOS)
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    # macos-26 ships Xcode 26 (Swift 6.2). Required: Expo SDK 56 / RN pods
    # declare Swift tools 6.2, and macos-latest's default Xcode (16.x, Swift
    # 6.1) fails SPM resolution ("installed version is 6.1.0").
    runs-on: macos-26
    # A cold xcodebuild is ~20-40 min. The CocoaPods download cache (the spec
    # repo + downloaded pods, outside the repo tree) survives `prebuild --clean`
    # and shaves the pod-install step; DerivedData lives under the cleaned ios/
    # so it can't be cached across runs. npm is cached by setup-node.
    timeout-minutes: 75
    env:
      # Maestro boots its XCTest driver with `xcodebuild test-without-building`,
      # then polls the driver's local HTTP port until it's listening. On the
      # macos-26 / Xcode 26 runner this cold start is intermittently flaky: when
      # it works the port binds in well under a minute, but on roughly half the
      # runs the runner never comes up at all (it crashes/never binds, not just a
      # slow start — observed: 946 failed status checks across the full window vs
      # ~170 on a good run). A longer window therefore can't fix it; the e2e step
      # below relaunches the driver by retrying instead. Give each attempt 4 min
      # (generous vs the sub-minute happy path, fails fast on a crash). Value in ms.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "240000"
    steps:
      - name: Checkout selected target
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}

      # JDK for Maestro (JVM-based).
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: ./mobile
        run: npm ci

      # Survives `prebuild --clean` (lives outside the repo); speeds pod install.
      - name: Cache CocoaPods downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: cocoapods-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: cocoapods-

      # macOS runners have no Docker (no nested virt). Provision Postgres/Redis
      # natively on the test-env ports so e2e-server.sh --native can seed + boot
      # the server from source against them.
      - name: Provision Postgres and Redis (native)
        run: |
          brew install postgresql@14 redis
          PGBIN="$(brew --prefix postgresql@14)/bin"
          PGDATA="$(brew --prefix)/var/postgresql@14"
          "$PGBIN/pg_ctl" -D "$PGDATA" -o "-p 37291" -l /tmp/pg.log start
          for _ in $(seq 1 30); do "$PGBIN/pg_isready" -p 37291 && break; sleep 1; done
          # Test config connects as a `postgres` superuser with an empty password.
          "$PGBIN/createuser" -p 37291 -s postgres || true
          "$PGBIN/createdb" -p 37291 -U postgres timecalendar || true
          "$PGBIN/createdb" -p 37291 -U postgres timecalendar_test || true
          redis-server --port 37292 --daemonize yes

      - name: Prebuild iOS (dev variant)
        working-directory: ./mobile
        env:
          APP_VARIANT: development
          BACKEND_ENVIRONMENT_CAPABILITY: development
          EXPO_PUBLIC_API_URL: http://localhost:3005
        run: npx expo prebuild --platform ios --clean

      # Release config embeds the JS bundle (no Metro). EXPO_PUBLIC_API_URL baked
      # here: localhost reaches the host server from the iOS simulator.
      - name: Build Release simulator app
        working-directory: ./mobile/ios
        env:
          APP_VARIANT: development
          BACKEND_ENVIRONMENT_CAPABILITY: development
          EXPO_PUBLIC_API_URL: http://localhost:3005
        run: |
          WORKSPACE="$(ls -d *.xcworkspace | head -n1)"
          # The app scheme matches the workspace basename for Expo apps
          # (TimeCalendarDev.xcworkspace -> scheme TimeCalendarDev). Do NOT use
          # `-list` schemes[0] — that picks an alphabetically-first CocoaPods
          # scheme (e.g. EXConstants), which builds a static lib and no .app.
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot a simulator and install the app
        working-directory: ./mobile/ios
        run: |
          echo "Xcode developer directory: $(xcode-select -p)"
          xcodebuild -version
          echo 'Available simulator runtimes:'
          xcrun simctl list runtimes available
          SIMCTL_JSON="$RUNNER_TEMP/simctl-devices.json"
          xcrun simctl list devices available --json > "$SIMCTL_JSON"
          SELECTION="$(python3 - "$SIMCTL_JSON" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              devices = json.load(source)["devices"]

          candidates = []
          for runtime, runtime_devices in devices.items():
              match = re.search(r"iOS-([0-9-]+)$", runtime)
              if not match:
                  continue
              version = tuple(int(part) for part in match.group(1).split("-"))
              for device in runtime_devices:
                  if "iPhone" in device["name"]:
                      candidates.append((version, device["name"], device["udid"], runtime))

          if not candidates:
              raise SystemExit("No available iPhone simulator found in simctl JSON")
          newest = max(candidate[0] for candidate in candidates)
          selected = sorted(
              (candidate for candidate in candidates if candidate[0] == newest),
              key=lambda candidate: (candidate[1], candidate[2]),
          )[0]
          print("\t".join(selected[1:]))
          PY
          )"
          IFS="$(printf '\t')" read -r DEVICE_NAME DEVICE_UDID DEVICE_RUNTIME <<EOF
          $SELECTION
          EOF
          [ -n "$DEVICE_UDID" ] || { echo 'No available iPhone simulator selected' >&2; exit 1; }
          echo "Selected simulator: name=$DEVICE_NAME udid=$DEVICE_UDID runtime=$DEVICE_RUNTIME"
          xcrun simctl boot "$DEVICE_UDID" || true
          APP="$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -n1)"
          xcrun simctl install "$DEVICE_UDID" "$APP"

      - name: Install Maestro
        run: |
          export MAESTRO_VERSION=2.8.0
          curl -fsSL https://get.maestro.mobile.dev | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          maestro --version

      - name: Test mobile E2E harness
        run: |
          ./mobile/e2e/test_run_e2e.sh
          ./mobile/e2e/test_ci_mobile_e2e.sh

      # --native: server from source against the natively-provisioned Postgres/Redis.
      # The harness gives each top-level YAML a fresh Maestro/XCTest lifecycle and
      # retries only a positively classified first-launch driver transport failure.
      # Assertion, application, and unknown failures remain terminal.
      - name: Run mobile E2E flows
        run: ./mobile/e2e/run_e2e.sh --native --startup-attempts 4

      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-debug-ios
          path: ~/.maestro/tests
          retention-days: 7

      - name: Upload server logs
        if: failure()
        run: ./ci/e2e-server.sh logs --native > /tmp/e2e-server-ios.log 2>&1 || true

      - name: Upload server logs artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-server-logs-ios
          path: /tmp/e2e-server-ios.log
          retention-days: 7
