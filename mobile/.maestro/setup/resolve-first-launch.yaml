appId: fr.samuelprak.timecalendar.dev
env:
  AWAIT_FIRST_LAUNCH: ${AWAIT_FIRST_LAUNCH || "false"}
---
# Nested reusable setup: top-level discovery intentionally excludes this file.
- runFlow:
    when:
      true: ${AWAIT_FIRST_LAUNCH == "true"}
    commands:
      # A clear-state launch can remain on native splash while migrations commit.
      # Await the protected route before evaluating the optional Skip branch.
      - extendedWaitUntil:
          visible:
            id: "onboarding-skip"
          timeout: 60000
- runFlow:
    when:
      visible:
        id: "onboarding-skip"
    commands:
      - tapOn:
          id: "onboarding-skip"
      - extendedWaitUntil:
          visible:
            id: "import-later-confirm"
          timeout: 60000
      - tapOn:
          id: "import-later-confirm"
      - extendedWaitUntil:
          visible:
            id: "home-scroll"
          timeout: 60000
