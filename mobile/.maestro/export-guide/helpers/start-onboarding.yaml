appId: fr.samuelprak.timecalendar.dev
---
- launchApp:
    clearState: true
- stopApp
- openLink: timecalendar-dev://onboarding
- runFlow: ../../helpers/confirm-ios-deep-link.yaml
- runFlow:
    when:
      notVisible: "Welcome to TimeCalendar!"
    commands:
      - openLink: timecalendar-dev://onboarding
      - runFlow: ../../helpers/confirm-ios-deep-link.yaml
- extendedWaitUntil:
    visible: "Welcome to TimeCalendar!"
    timeout: 60000
- tapOn:
    id: "onboarding-next"
- extendedWaitUntil:
    visible: "Page 2 of 3"
    timeout: 60000
- tapOn:
    id: "onboarding-next"
- extendedWaitUntil:
    visible:
      id: "onboarding-welcome-cta"
    timeout: 60000
- tapOn:
    id: "onboarding-welcome-cta"
- extendedWaitUntil:
    visible: "E2E Export ADE Safe"
    timeout: 60000
