appId: fr.samuelprak.timecalendar.dev
---
- runFlow: helpers/start-onboarding.yaml
- tapOn: "E2E Export Future Provider"
- runFlow: helpers/enter-programme.yaml
- tapOn:
    id: "onboarding-connect-continue"
- extendedWaitUntil:
    visible: "Display your timetable(,.*)?"
    timeout: 60000
- assertVisible: "Page 1 of 3"
- extendedWaitUntil:
    visible:
      id: "export-guide-page-image-placeholder"
    timeout: 60000
- tapOn:
    id: "export-guide-next"
- tapOn:
    id: "export-guide-next"
- assertVisible: "Page 3 of 3"
- tapOn:
    id: "export-guide-next"
- extendedWaitUntil:
    visible:
      id: "onboarding-import-content"
    timeout: 60000
