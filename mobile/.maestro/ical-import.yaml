# iCal-URL entry render + reachability + inline-validation e2e step (Phase-3 ship
# 4 / add-mobile-ical-import).
#
# Cold-launches the development-variant app, deep-links to the onboarding welcome
# surface, taps the "Add by URL" CTA, asserts the URL-entry screen renders (a
# stable title assertion), and submits with an EMPTY field to assert the inline
# validation error shows — DETERMINISTIC, NO NETWORK, cross-platform.
#
# Recovery is exercised without a university: the Tours URL is rejected by the
# server's value-blind preflight before fetch, and the RFC-reserved `.invalid`
# host deterministically produces a bounded upstream failure. No feedback is
# sent. The top-level flow remains lifecycle-isolated by ADR 038.
#
# Requires the harness server up (ci/e2e-server.sh up) + a release-config
# dev-variant build installed (mobile/e2e/run_e2e.sh). Shared across iOS and
# Android: stable seeded-text assertions, no per-platform selectors. Mirrors
# onboarding.yaml / settings.yaml.
appId: fr.samuelprak.timecalendar.dev
---
- launchApp
- stopApp
- openLink: timecalendar-dev://onboarding
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Open"
          optional: true
- extendedWaitUntil:
    visible: "TimeCalendar"
    timeout: 60000
# Tap the "Add by URL" CTA → pushes /onboarding/ical-url.
- tapOn:
    id: "onboarding-welcome-url-cta"
# The URL-entry screen renders.
- extendedWaitUntil:
    visible: "Add a calendar by URL"
    timeout: 60000
# Submit with an empty field → the inline validation error shows (no network).
- tapOn:
    id: "ical-url-submit"
- extendedWaitUntil:
    visible: "Enter a calendar URL."
    timeout: 10000
# Known unsupported web UI: server preflight, no upstream request.
- tapOn:
    id: "ical-url-input"
- inputText: "https://ade.univ-tours.fr/login"
- tapOn:
    id: "ical-url-submit"
- extendedWaitUntil:
    visible: "Use a Tours iCal export"
    timeout: 20000
- assertNotVisible:
    id: "ical-url-retry"
- tapOn:
    id: "ical-url-correct"
- eraseText
# RFC 2606 reserved host: deterministic DNS failure, never a university.
- inputText: "https://calendar-outage.invalid/export.ics"
- tapOn:
    id: "ical-url-submit"
- extendedWaitUntil:
    visible: "Timetable service unavailable"
    timeout: 30000
- assertVisible:
    id: "ical-url-retry"
- assertVisible:
    id: "ical-url-report"
