# iCal-URL entry render + reachability + inline-validation e2e step (Phase-3 ship
# 4 / add-mobile-ical-import).
#
# Cold-launches the development-variant app, deep-links to the onboarding welcome
# surface, reaches the "Add by URL" entry, asserts the URL-entry screen renders (a
# stable title assertion), and submits with an EMPTY field to assert the inline
# validation error shows. The VALIDATION half is deterministic and offline;
# cross-platform throughout.
#
# The entry point MOVED twice. Commit 482f134 moved it from the welcome carousel
# to `onboarding-school-missing`; merged commit a10ab396 then made that action open
# the institution → programme → connect → manual-import journey instead of jumping
# straight to /onboarding/ical-url. This flow follows the shipped journey and picks
# its URL option, so it still proves the entry is reachable rather than deep-linking
# around it. The school step still performs the LIVE GET /schools read before its
# footer action mounts, so the reachability half requires the harness server; only
# the empty-submit VALIDATION half below is offline.
#
# The actual import ROUND-TRIP is NOT e2e-driven: the dev harness (ci/e2e-server.sh)
# seeds no parseable .ics import endpoint and a live external .ics would be flaky
# cross-platform (same posture as ship 3's camera, and the onboarding.yaml note
# about the Jest-proven group step). The validate→create→handoff wiring + the
# server-failure → recordError + retry path are proven deterministically by the
# Jest proof (ical-url-screen.test.tsx, mocking the customFetch mutator). The real
# import + a11y + Crashlytics arrival is an inbox/DoD on-device pass
# (inbox/2026-06-15-ical-import-dod-manual.md).
#
# Requires the harness server up (ci/e2e-server.sh up) + a release-config
# dev-variant build installed (mobile/e2e/run_e2e.sh). Shared across iOS and
# Android: stable seeded-text assertions, no per-platform selectors. Mirrors
# onboarding.yaml / settings.yaml.
appId: fr.samuelprak.timecalendar.dev
---
- launchApp
- stopApp
- openLink: timecalendar-dev://onboarding
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Open"
          optional: true
# The carousel's first-page title, NOT the bare app name — `TimeCalendar` is
# `app.name` verbatim and does render, but on the home screen, not here (see
# onboarding.yaml for the full note). Android reached this flow first and failed
# here against a screenshot showing the welcome page correctly rendered.
- extendedWaitUntil:
    visible: "Welcome to TimeCalendar!"
    timeout: 60000
# Advance the welcome carousel and take the final CTA → pushes /onboarding/school.
- tapOn:
    id: "onboarding-next"
- tapOn:
    id: "onboarding-next"
- tapOn:
    id: "onboarding-welcome-cta"
# The school step renders. Its header/footer only mount in the browsing state, so
# waiting on the title also guarantees the list finished loading and the
# "I can't find my school" footer action is on screen.
- extendedWaitUntil:
    visible: "Select your school"
    timeout: 60000
# "I can't find my school" → begins the unlisted-institution import journey.
- tapOn:
    id: "onboarding-school-missing"
# Name the unlisted institution, supply a programme, continue through the
# connection guidance, then take the manual-import screen's URL option. These
# stable ids are shared by Android and iOS; no platform branch is required.
- extendedWaitUntil:
    visible:
      id: "onboarding-institution-input"
    timeout: 60000
- tapOn:
    id: "onboarding-institution-input"
- inputText: "E2E Institution"
- extendedWaitUntil:
    visible:
      id: "onboarding-institution-input"
      text: "E2E Institution"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "onboarding-institution-continue"
    timeout: 15000
- tapOn:
    id: "onboarding-institution-continue"
- extendedWaitUntil:
    visible:
      id: "onboarding-programme-input"
    timeout: 60000
- tapOn:
    id: "onboarding-programme-input"
- inputText: "E2E Programme"
- extendedWaitUntil:
    visible:
      id: "onboarding-programme-input"
      text: "E2E Programme"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "onboarding-programme-continue"
    timeout: 15000
- tapOn:
    id: "onboarding-programme-continue"
- extendedWaitUntil:
    visible:
      id: "onboarding-connect-continue"
    timeout: 60000
- tapOn:
    id: "onboarding-connect-continue"
- extendedWaitUntil:
    visible:
      id: "onboarding-import-url"
    timeout: 60000
- tapOn:
    id: "onboarding-import-url"
# The URL-entry screen renders.
- extendedWaitUntil:
    visible: "Add a calendar by URL"
    timeout: 60000
# Submit with an empty field → the inline validation error shows (no network).
- tapOn:
    id: "ical-url-submit"
- extendedWaitUntil:
    visible: "Enter a calendar URL."
    timeout: 10000
