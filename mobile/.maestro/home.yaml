# Home today-view real-round-trip e2e flow (ADR 022 / 030).
#
# Imports the seeded `e2e-smoke-calendar` token (the shared import-seed.yaml
# preamble), then cold-restarts into the Home tab so the startup sync re-fetches
# the now-held token and the today view renders REAL synced data — proving app →
# generated client → customFetch → NestJS → Postgres end to end on the home surface.
#
# This replaces the former reachability-only flow. Previously a fresh e2e launch
# had an empty user_calendars table, so the startup sync no-op'd and the today view
# showed the empty-day state ("Nothing planned.") — the "SEEDED-DATA LIMITATION".
# The dev-import deep link now makes the app durably hold the token; the seeded
# `E2E Today Lecture` is a today-anchored event that lands on the today timeline.
#
# Why cold-restart into Home instead of tapping the tab: the preamble lands on
# /calendar (its router.replace target), and the native tab label ("Home"/"Accueil")
# is locale-dependent. A stopApp→launchApp cold start returns to the (tabs) index
# (Home) WITHOUT clearing state (clearState was the preamble's FIRST step, before
# the import), so the held token survives and useStartupSync repopulates the today
# view — locale-independent and robust.
#
# What it deliberately does NOT do (design non-goals): assert the dense-overlap
# mini-timeline column packing or frame rate (real hardware — the on-device visual
# pass). The today-view seam composition is proven deterministically by the Jest
# proof tests (home-screen.test.tsx + today-timeline.test.tsx).
#
# Requires a release-config dev-variant build + the e2e server (ci/e2e-server.sh)
# seeding the token. Shared across iOS and Android: stable localized text / testID
# assertions, no per-platform selectors. Run via mobile/e2e/run_e2e.sh.
appId: fr.samuelprak.timecalendar.dev
---
# Import the seeded token, sync it, and land on the calendar (see import-seed.yaml).
- runFlow: import-seed.yaml
# Cold-restart into the Home tab (the (tabs) index). The held token survives the
# restart (clearState ran only at the preamble's start), so useStartupSync
# repopulates the today view.
- stopApp
- launchApp
# The app-name heading renders past the splash + the startup sync. Generous timeout:
# a release-config cold start + JS bundle load + the sync round-trip can land past
# Maestro's ~17s default.
- extendedWaitUntil:
    visible: "TimeCalendar"
    timeout: 60000
# The real synced today event renders on the today timeline — `E2E Today Lecture`
# is a today-anchored seeded event. Its presence (NOT "Nothing planned.") is the
# round-trip proof (do NOT weaken this to the empty-day state — that reintroduces
# the gap this flow closes). `(,.*)?` because a today-timeline tile is an
# accessibility container labelled `{{title}}, {{time}} {{location}}`, so iOS
# exposes only that composed label — see calendar.yaml for the full rationale.
#
# Wait for the sync to paint the timeline before scrolling: the app-name heading
# renders before the events arrive, so scrolling immediately would race the render
# and scroll an empty grid to its end. `E2E Overlap A` is the 10:00 tile, the first
# one the timeline draws, so it is on screen as soon as there is anything to reveal.
- extendedWaitUntil:
    visible: "E2E Overlap A(,.*)?"
    timeout: 60000
# The tile is below the fold and its position is time-of-day dependent, so a plain
# assert is only reliable for a run that happens to start early. The timeline is a
# fixed-scale grid whose top is the day's first event (10:00, `E2E Overlap A`); the
# lecture is at 14:00, four hours of pixels further down, and the viewport shows
# roughly two. In run 33193527228 the Android screenshot showed the grid rendered
# correctly from 10:00 to 12:00 with the lecture simply off-screen — the same
# below-the-fold class as the Settings rows, not a sync or data failure. Centring
# also keeps the revealed tile clear of the tab bar and the compose FAB.
- scrollUntilVisible:
    element:
      text: "E2E Today Lecture(,.*)?"
    direction: DOWN
    centerElement: true
    timeout: 60000
- assertVisible: "E2E Today Lecture(,.*)?"
