appId: fr.samuelprak.timecalendar.dev
---
# The "Open in …?" prompt can take longer than tapOn's own lookup to appear on
# a loaded CI simulator, and a tap that lands while it is still animating in is
# dropped, so wait for it first and tap again until it is gone.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Open in .*"
          timeout: 20000
          optional: true
      - repeat:
          while:
            visible: "Open in .*"
          times: 5
          commands:
            - tapOn:
                text: "Open"
                optional: true
            - waitForAnimationToEnd:
                timeout: 3000
