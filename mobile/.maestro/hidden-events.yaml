# Hidden-events real-round-trip e2e flow (ADR 023 / 030).
#
# Imports the seeded `e2e-smoke-calendar` token (the shared import-seed.yaml
# preamble), opens a REAL synced event's details by its stable seeded uid, hides it,
# proves it disappears from the calendar view, un-hides it from the management
# screen, and proves it reappears — round-tripping the hidden set through the real
# device-local store and the events-source filter, end to end on a real device.
#
# This replaces the former reachability-only flow, which could only assert the
# empty hidden-set state (the "SEEDED-DATA LIMITATION") because no real synced event
# was reachable to hide. The dev-import deep link now makes the app hold the token;
# `E2E Hide Seminar` (seeded uid `e2e-hide-seminar`, DISTINCT from the checklist
# flow's `E2E Today Lecture` so the two flows don't collide) is the event hidden and
# un-hidden here.
#
# Seed-date contract: the hide pair is anchored on the UTC day AFTER the seed run,
# not in the today cluster (`server/src/scripts/seed-e2e-calendar.ts`). The agenda's
# window is `[today 00:00, today + 7 days)` and forward-only, computed from the
# DEVICE clock when the flow mounts it — while the server seeds once, at the start
# of a job that can run over an hour. In run 33220510226 the iOS job seeded on
# Aug 28 and reached this flow on Aug 29: the hide target and its control were both
# on the excluded previous day, the agenda rendered "No events this period.", and a
# pure date defect failed here looking exactly like a broken hide. A next-day anchor
# is inside the window from both days' anchors, so one midnight crossing cannot move
# it out. The titles are date-neutral for the same reason — an `E2E Today …` name on
# an event that is deliberately not today sends the next reader hunting an app bug.
#
# Selector notes: the hide action is the details header button (visually localized
# "Hide", but exposed to Maestro by its accessibility label "Hide this event")
# opening a native Alert chooser whose "Hide this event" option hides by uid.
#
# Those two strings are BYTE-IDENTICAL and come from two different i18n keys —
# `eventDetails.hide.actionLabel` (the header button's a11y label) and
# `eventDetails.hide.thisEvent` (the alert option). A bare `text: "Hide this event"`
# therefore matches BOTH, and Maestro picks by hierarchy order, not by intent: on iOS
# it ranked the app-window header first, so the chooser option was never tapped, the
# event was never hidden, and the assertNotVisible below failed on a genuinely
# visible tile (run 33206115891 — both taps resolved to the same header element,
# bounds [334,62][382,106]). Android passed the same YAML only because its dialog
# happened to sort ahead of the header; the selector was non-deterministic on both.
# The second tap is therefore anchored `below` the Alert's title "Hide event"
# (`eventDetails.hide.title`) — a full-match regex that cannot match "Hide this
# event", and an anchor the header button (y 62-106, above the alert on both
# platforms) can never satisfy. One cross-platform selector, no platform fork. The
# `extendedWaitUntil` in front of it turns a future "the alert never opened" into an
# explicit failure instead of a silent re-tap on the header.
#
# The management-screen un-hide row renders the event title + a "Un-hide" control (a11y
# label "Un-hide <title>"). The agenda switch goes through ONE control shared by
# both platforms: `calendar-view` is the iOS `@expo/ui` `Picker`
# (`appearance="menu"`) and the Android `@react-native-menu/menu` trigger
# (calendar-view-menu.tsx); "Agenda" is picked from its native menu and is the
# same label in EN + FR. The e2e device runs in EN (the established convention —
# settings.yaml asserts "Settings", the old hidden-events flow asserted "Hidden
# events" / "No hidden events."), so the localized taps use the EN strings.
#
# The flow leaves the hidden set RESTORED (the event is un-hidden at the end), so a
# later flow / re-run starts clean — belt-and-braces on top of the preamble's
# clearState (each calendar-family flow wipes the slate first).
#
# The final Agenda reveal must scroll. Run 33349187760 proved the un-hide action,
# reopened the Agenda, and rendered the next-day control at the bottom edge, while
# `E2E Hide Seminar` (the following 16:00 row) remained below the viewport until a
# non-scrolling 60-second wait expired. Centre the target before the final positive
# assertion so the real hide -> absent -> un-hide -> present round trip stays
# non-vacuous on both platforms.
#
# Requires a release-config dev-variant build + the e2e server (ci/e2e-server.sh)
# seeding the token. Shared across iOS and Android: stable localized text
# assertions, no per-platform selectors. Run via mobile/e2e/run_e2e.sh.
appId: fr.samuelprak.timecalendar.dev
---
# Import the seeded token, sync it, and land on the calendar (see import-seed.yaml).
- runFlow: import-seed.yaml
# Cold-restart into the seeded event's details by its stable uid. The held token
# survives the restart (clearState ran only at the preamble's start).
- stopApp
- openLink: timecalendar-dev://event-details/e2e-hide-seminar
# iOS shows a system "Open in <app>?" confirmation on the FIRST deep link per
# simulator — tap when present, skip otherwise.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Open"
          optional: true
# Real details render, proving the synced event resolved (NOT the not-found state).
- extendedWaitUntil:
    visible: "E2E Hide Seminar(,.*)?"
    timeout: 60000
# Hide it: the header's accessible "Hide this event" action opens the native Alert
# chooser; the identically labelled chooser option hides by uid and pops back. The
# second tap is anchored under the alert title so the header cannot satisfy it (see
# the selector notes above), and the wait proves the chooser is actually up first.
- tapOn:
    text: "Hide this event"
- extendedWaitUntil:
    visible: "Hide all events of the same name"
    timeout: 30000
- tapOn:
    text: "Hide this event"
    below:
      text: "Hide event"
# Prove it is GONE from the calendar view. Cold-restart into the agenda: the token
# is still held (un-hide restores state; the hidden set is device-local), so the
# synced events render — but `E2E Hide Seminar` is filtered out while
# `E2E Hide Control` (NOT hidden) still renders (proving the filter hides ONLY the
# target, not an empty-view false positive).
#
# The control is `E2E Hide Control`, seeded alongside the target on the next UTC
# day, and NOT the seed-day `E2E Today Lecture` it used to be: a control has to
# survive whatever the target survives, or it stops being a guard against an empty
# agenda on exactly the midnight crossing that empties one.
#
# The `(,.*)?` suffix carries real weight on the assertNotVisible below: an agenda
# tile is an iOS accessibility container exposing only its composed label (see
# calendar.yaml), so the bare title matched nothing on iOS and the "it is hidden"
# assertion passed VACUOUSLY — it would have passed with the event still on screen.
- stopApp
- openLink: timecalendar-dev://calendar
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Open"
          optional: true
- extendedWaitUntil:
    visible: "Calendar"
    timeout: 60000
- tapOn:
    id: "calendar-view"
- tapOn:
    text: "Agenda"
- extendedWaitUntil:
    visible: "E2E Hide Control(,.*)?"
    timeout: 60000
- assertNotVisible: "E2E Hide Seminar(,.*)?"
# Open the hidden-events management screen and assert the hidden event is listed.
- stopApp
- openLink: timecalendar-dev://hidden-events
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Open"
          optional: true
- extendedWaitUntil:
    visible: "E2E Hide Seminar(,.*)?"
    timeout: 60000
# Un-hide it (a11y label "Un-hide <title>" — unambiguous with a single hidden event).
- tapOn:
    text: "Un-hide E2E Hide Seminar"
# Prove it REAPPEARS: back on the calendar agenda, the un-hidden event renders again.
- stopApp
- openLink: timecalendar-dev://calendar
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Open"
          optional: true
- extendedWaitUntil:
    visible: "Calendar"
    timeout: 60000
- tapOn:
    id: "calendar-view"
- tapOn:
    text: "Agenda"
- scrollUntilVisible:
    element:
      text: "E2E Hide Seminar(,.*)?"
    direction: DOWN
    centerElement: true
    timeout: 60000
- assertVisible: "E2E Hide Seminar(,.*)?"
