# Development-build happy path for the visible environment switch. The flow is
# committed for the device-capable CI/host; this no-KVM agent host does not run it.
#
# The effective environment is read from the Settings environment entry, which is the
# app's only environment indicator — there is no banner. Two consequences shape the
# selectors below:
#   - iOS collapses the row into a single accessibility element, so the value is only
#     readable from the composed accessible name ("Environment, Local"), while Android
#     exposes the secondary text node ("Local"). Maestro matches a text selector as a
#     regex against the whole string, so ".*Local" full-matches on both platforms and no
#     single literal would.
#   - The environment entry is Settings' last section and may sit below the fold, where
#     it fails exactly like a deleted element. scrollUntilVisible brings it into view and
#     is a no-op when it is already on screen.
appId: fr.samuelprak.timecalendar.dev
---
- launchApp:
    clearState: true
# Cold-start readiness, not an app assertion: a release-config launch on a degraded
# macOS runner can outlast a 60 s wait. In run 33216821519 this flow's launchApp alone
# took 75.8 s and the 60 s wait then expired in full, failing here with 4 recorded
# commands. A launch-gate timeout is classified terminal (it is past launchApp), so the
# retry budget never applies to it — the wait itself has to cover the slow runner.
- extendedWaitUntil:
    visible: "Settings"
    timeout: 120000
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      id: "settings-environment"
    direction: DOWN
    timeout: 60000
- assertVisible: ".*Local"
- tapOn:
    id: "settings-environment"
- tapOn: "Preproduction"
- assertVisible: "Clear data and switch?"
- tapOn: "Clear and switch"
# The reset reloads the app onto the initial route, so the entry has to be navigated to
# again rather than asserted in place.
- extendedWaitUntil:
    visible: "Settings"
    timeout: 60000
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      id: "settings-environment"
    direction: DOWN
    timeout: 60000
- assertVisible: ".*Preproduction"
