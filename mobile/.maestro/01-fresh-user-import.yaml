# Fresh student → listed school → programme → export guide → real URL import → synced details.
appId: fr.samuelprak.timecalendar.dev
---
- launchApp:
    clearState: true
- stopApp
- openLink: timecalendar-dev://onboarding
- runFlow: helpers/confirm-ios-deep-link.yaml
- extendedWaitUntil:
    visible: "Welcome to TimeCalendar!"
    timeout: 60000
- tapOn:
    id: "onboarding-next"
- tapOn:
    id: "onboarding-next"
- tapOn:
    id: "onboarding-welcome-cta"
- extendedWaitUntil:
    visible: "My Gaming Academia"
    timeout: 60000
- tapOn: "My Gaming Academia"
- extendedWaitUntil:
    visible:
      id: "onboarding-programme-input"
    timeout: 60000
- tapOn:
    id: "onboarding-programme-input"
- inputText: "E2E Programme"
- extendedWaitUntil:
    visible:
      id: "onboarding-programme-input"
      text: "E2E Programme"
    timeout: 15000
- pressKey: Enter
# The seeded school has no intranet URL, so the journey skips Connect and
# walks the export guide; the loop tolerates any catalogue page count.
- extendedWaitUntil:
    visible:
      id: "export-guide-page"
    timeout: 60000
- repeat:
    times: 10
    while:
      notVisible:
        id: "onboarding-import-url"
    commands:
      - scrollUntilVisible:
          element:
            id: "export-guide-next"
          direction: DOWN
      - tapOn:
          id: "export-guide-next"
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible:
      id: "onboarding-import-url"
    timeout: 60000
- tapOn:
    id: "onboarding-import-url"
- extendedWaitUntil:
    visible:
      id: "ical-url-input"
    timeout: 60000
- tapOn:
    id: "ical-url-input"
- inputText: "http://127.0.0.1:3005/__e2e/ical/import.ics"
- tapOn:
    id: "ical-url-submit"
# The URL form unmounts as soon as Import starts; only the result screen's
# action proves the calendar is persisted before stopApp.
- extendedWaitUntil:
    visible:
      id: "calendar-import-result-calendar"
    timeout: 120000

# Cold re-entry triggers the normal startup sync for the newly held calendar.
- runFlow: helpers/open-calendar-agenda.yaml
- extendedWaitUntil:
    visible:
      id: "agenda-section-list"
    timeout: 60000
# If startup sync has not populated Agenda yet, exercise the explicit empty-state
# refresh action and wait on the same real server round trip.
- runFlow:
    when:
      visible:
        id: "calendar-empty-refresh"
    commands:
      - tapOn:
          id: "calendar-empty-refresh"
- extendedWaitUntil:
    visible: "E2E Imported Lecture(,.*)?"
    timeout: 60000
- tapOn: "E2E Imported Lecture(,.*)?"
- extendedWaitUntil:
    visible: "E2E Imported Lecture(,.*)?"
    timeout: 60000
- assertVisible: "Room E2E Import"
- assertVisible: "Server-backed import fixture."
