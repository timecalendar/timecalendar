appId: fr.samuelprak.timecalendar.dev
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Settings"
    timeout: 60000
- tapOn: "Settings"
- extendedWaitUntil:
    visible:
      id: "settings-calendar-summary"
    timeout: 60000
- assertVisible: "Events"
- assertVisible: "Personal events"
- assertVisible: "Hidden events"
- assertVisible: "Preferences"
- assertVisible: "Appearance & language"
- assertVisible: "Notifications"
- tapOn:
    id: "settings-calendar-summary"
- extendedWaitUntil:
    visible: "My calendars"
    timeout: 60000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "BackButton"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible: "Settings"
    timeout: 60000
- tapOn:
    id: "settings-appearance"
- extendedWaitUntil:
    visible: "Appearance & language"
    timeout: 60000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "BackButton"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible: "Settings"
    timeout: 60000
