appId: fr.samuelprak.timecalendar.dev
---
- launchApp:
    clearState: true
- runFlow:
    file: setup/resolve-first-launch.yaml
    env:
      AWAIT_FIRST_LAUNCH: "true"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 60000
- tapOn: "Settings"
- extendedWaitUntil:
    visible:
      id: "settings-calendar-summary"
    timeout: 60000
- assertVisible: "Events"
- assertVisible: "Personal events"
- assertVisible: "Hidden events"
- assertVisible: "Preferences"
- assertVisible: "Appearance & language"
- assertVisible: "Notifications"
- tapOn:
    id: "settings-calendar-summary"
- extendedWaitUntil:
    visible: "My calendars"
    timeout: 60000
- back
- extendedWaitUntil:
    visible: "Settings"
    timeout: 60000
- tapOn:
    id: "settings-appearance"
- extendedWaitUntil:
    visible: "Appearance & language"
    timeout: 60000
- back
- extendedWaitUntil:
    visible: "Settings"
    timeout: 60000
