# Onboarding welcome → school read round-trip e2e flow (Phase-3 ship 1 / ADR 015,
# extending C1 / TIM-134).
#
# Cold-launches the development-variant app, deep-links to the onboarding WELCOME
# surface (now the onboarding entry — the school step moved to /onboarding/school),
# asserts the brand welcome title renders, advances through the three-page carousel,
# taps the final CTA, then asserts
# a seeded school renders from the LIVE GET /schools round-trip (app → generated
# client → customFetch → NestJS → Postgres, nothing mocked) — proving welcome →
# CTA → live server-data read. The Phase-2 live-read proof is preserved, just
# reached via the CTA tap.
#
# The asserted name "My Gaming Academia" is the visible:true ASCII seeded fixture
# in server/src/modules/school/fixtures/school.fixtures.yml — ASCII-only to avoid
# accent-matching fragility across platforms.
#
# Phase-3 ship 2 (completed picker) adds a STABLE school-search step (type a
# matching / non-matching needle into the school search field, assert the seeded
# ASCII school shows / hides — see the selector note below). The completed group step
# (multi-select toggle + confirm + dismissTo) is Jest-proven, NOT e2e-driven: the
# group tree's leaf selectors vary by school/fixture and a tap-into-nested-step
# assertion would be brittle across both platforms (D5). The school→group
# navigation WIRING is proven deterministically by the Jest proof tests
# (school-picker-screen.test.tsx asserts the push + the accent/code search; the
# group screen test asserts toggle + confirm-commit + dismissTo + the empty
# guard); the welcome→school push is proven by welcome-screen.test.tsx. If a
# stable group selector ever proves reliable on both platforms, a nested-step
# assertion MAY be added as a bonus — only if reliable; do not ship a flaky step.
#
# Requires the harness server up (ci/e2e-server.sh up) + a release-config
# dev-variant build installed (mobile/e2e/run_e2e.sh). Shared across iOS and
# Android: stable seeded-text assertions, no per-platform selectors. Mirrors
# settings.yaml / personal-events.yaml.
appId: fr.samuelprak.timecalendar.dev
---
- launchApp
# Cold-start via the deep link: a warm openLink does not navigate on Android
# release builds — Expo Router resolves the link through getInitialURL on a cold
# launch, so stopApp first, then openLink relaunches.
- stopApp
- openLink: timecalendar-dev://onboarding
# iOS shows a system "Open in <app>?" confirmation for custom-scheme deep links
# (Android does not). It appears only on the FIRST deep link per simulator —
# later flows (and re-runs) get no dialog — so the tap is optional: tap it when
# present, skip otherwise.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Open"
          optional: true
# The welcome surface renders. Generous timeout: a release-config iOS cold start +
# JS bundle load can land just past Maestro's ~17s default. extendedWaitUntil is
# the assert-with-timeout.
#
# Assert the carousel's FIRST-PAGE title, not the bare app name. `TimeCalendar` is
# `app.name` verbatim, so it looks valid and does render — but on the HOME screen,
# not here: the carousel (482f134) renders `onboarding.page.welcome.title`, and a
# Maestro text selector is a fully anchored regex, so the bare app name matched
# nothing on the very screen this step exists to prove. The id guard cannot catch
# this one — both strings are real, they just belong to different screens — so the
# EN literal is asserted directly, as onboarding.pageIndicator's neighbours below
# already do (the e2e device runs in EN).
- extendedWaitUntil:
    visible: "Welcome to TimeCalendar!"
    timeout: 60000
# Advance welcome → agenda → notifications through the stable, platform-neutral
# control and prove the final page before entering the existing school picker.
- tapOn:
    id: "onboarding-next"
- tapOn:
    id: "onboarding-next"
- assertVisible: "Get notified"
# Tap the final CTA → pushes /onboarding/school (the existing picker).
- tapOn:
    id: "onboarding-welcome-cta"
# The school step renders.
- extendedWaitUntil:
    visible: "Select your school"
    timeout: 60000
# The live GET /schools round-trip assertion: the seeded school only renders if
# the read committed end to end through the real server.
- extendedWaitUntil:
    visible: "My Gaming Academia"
    timeout: 60000
# Stable accent-free school-search step (Phase-3 ship 2): typing a matching needle
# keeps the seeded ASCII school visible; a non-matching needle hides it; clearing
# brings it back. Cross-platform stable — the seeded name + the EN placeholder are
# fixed, no fixture-dependent selectors (unlike the group leaves — those stay
# Jest-proven, D5). Proves the search filter end to end against the live list.
#
# The search field is now the native-header search bar (`headerSearchBarOptions`
# in school-picker-screen.tsx), which react-native-screens' SearchBarProps cannot
# carry a testID through. Android initially collapses that control to a `Search`
# accessibility action, while iOS exposes the field directly, so the shared flow
# optionally expands it before addressing the `Search schools` placeholder.
# Android's native SearchView exposes that placeholder with leading spaces in
# its hierarchy, so the anchored Maestro regex accepts only that native prefix.
# Both labels are locale-stable under the suite's EN-device convention. The
# former `onboarding-school-filter` testID is gone.
- tapOn:
    text: "Search"
    optional: true
- tapOn:
    text: ".*Search schools"
- inputText: "Gaming"
- extendedWaitUntil:
    visible: "My Gaming Academia"
    timeout: 10000
- eraseText
- inputText: "zzzznomatch"
- extendedWaitUntil:
    notVisible: "My Gaming Academia"
    timeout: 10000
- eraseText
