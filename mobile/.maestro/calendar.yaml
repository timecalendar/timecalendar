# Calendar real-round-trip e2e flow (ADR 019 / 020 / 021 / 030).
#
# The anchor proof that the whole seeded-token mechanism works end to end: it
# imports the seeded `e2e-smoke-calendar` token (the shared import-seed.yaml
# preamble), then asserts that REAL SYNCED DATA renders on the calendar surface and
# that tapping a synced tile opens its REAL event-details — proving app → generated
# client → customFetch → NestJS → Postgres end to end, nothing mocked.
#
# This replaces the former reachability-only flow. Previously a fresh e2e launch
# had an empty user_calendars table, so the startup sync no-op'd and every view was
# empty — the flow could only assert the empty/not-found states (the "SEEDED-DATA
# LIMITATION"). The dev-import deep link now makes the app durably hold the token
# and sync it (see import-seed.yaml + server/src/scripts/seed-e2e-calendar.ts): the
# seeded `E2E Today Lecture` (a today-anchored event) is a real synced tile.
#
# The assertion path is the AGENDA view: calendar-kit grid tiles live inside a
# Reanimated worklet grid whose positioned wrappers are the library's, so the
# agenda list (a flat FlatList of title text) is the robust cross-platform surface
# to assert + tap a synced title (design D5). "Agenda" is the same label in FR + EN.
#
# What it deliberately does NOT do (design non-goals): assert dense-overlap COLUMN
# PACKING or frame rate (the Reanimated grid's internal layout is the library's;
# frame rate needs real hardware — the on-device manual pass). The screen wiring is
# also proven deterministically by the Jest proof tests (calendar-screen.test.tsx +
# event-details-screen.test.tsx + data/sync/*.test).
#
# Requires a release-config dev-variant build + the e2e server (ci/e2e-server.sh)
# seeding the token. Shared across iOS and Android: stable localized text / testID
# assertions, no per-platform selectors. Run via mobile/e2e/run_e2e.sh.
appId: fr.samuelprak.timecalendar.dev
---
# Import the seeded token, sync it, and land on the calendar (see import-seed.yaml).
- runFlow: import-seed.yaml
# Switch to the agenda view — the robust surface to assert + tap a synced title.
- tapOn:
    id: "calendar-view"
- tapOn: "Agenda"
# The real synced tile renders: `E2E Today Lecture` is a today-anchored seeded
# event returned by POST /calendars/sync. Generous timeout so the just-triggered
# sync settles before the first synced-title assertion (do NOT weaken this to an
# empty/reachability assertion — that reintroduces the gap this flow closes).
- extendedWaitUntil:
    visible: ".*E2E Today Lecture.*"
    timeout: 60000
# Tap the synced tile → its REAL event-details (a Stack sibling of (tabs)).
- tapOn:
    text: ".*E2E Today Lecture.*"
# Event-details shows REAL content — the seeded title + location render. This is
# the round-trip proof: the not-found screen has no title/location, so a visible
# seeded title + location IS the resolved-details state (the old reachability flow
# asserted the not-found message instead — locale-specific text we avoid here so
# the assertion stays cross-platform + locale-stable).
- extendedWaitUntil:
    visible: "E2E Today Lecture"
    timeout: 60000
- assertVisible: "Room E2E Lecture"
